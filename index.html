  const SUPA_KEY = 'sb_publishable_Nx-X2sKGB3KXuvGQvsMdlw_VruQ27vW';
  if(new URLSearchParams(location.search).get('dev') === '1') localStorage.setItem('anecdotas_dev','1');
  if(new URLSearchParams(location.search).get('dev') === '0') localStorage.removeItem('anecdotas_dev');
  const IS_DEV = localStorage.getItem('anecdotas_dev') === '1';
  function trackEvent(episodeId, episodeNumber, action, metadata) {
    fetch(`${SUPA_URL}/rest/v1/events`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 400 15px/1.4 var(--font-sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  [hidden] { display: none !important; }

  .dato { font: 400 12px/1.45 var(--font-mono); color: var(--muted); }
  .envase { width: min(1280px, 100%); margin: 0 auto; padding: 0 var(--space-3); }

  /* ── Barra de arriba: buscar y elegir, siempre a mano ── */
  .barra {
    position: sticky; top: 0; z-index: 20;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
  }
  .barra-fila { display: flex; align-items: center; gap: var(--space-3); height: 64px; }
  .logo { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .logo svg { width: 26px; height: 26px; display: block; }
  .logo b { font: 800 22px/1 var(--font-display); letter-spacing: -0.01em; }
  .buscador { position: relative; flex: 1; max-width: 640px; margin: 0 auto; }
  .buscador svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .buscador input {
    width: 100%; height: 42px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-m);
    color: var(--ink);
    font: 400 16px/1 var(--font-sans);
    padding: 0 38px 0 40px;
  }
  .buscador input::placeholder { color: var(--muted); }
  .buscador input::-webkit-search-cancel-button { display: none; }
  .buscador input:focus-visible { outline-offset: 0; border-color: var(--accent); }
  .borrar { position: absolute; right: 5px; top: 5px; width: 32px; height: 32px; border-radius: var(--radius-s); color: var(--muted); display: grid; place-items: center; }
  .borrar:hover { color: var(--ink); background: var(--surface-raised); }

  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    height: 42px; padding: 0 var(--space-3);
    font-weight: 600; line-height: 1.2; white-space: nowrap;
    border-radius: var(--radius-m);
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    transition: background .12s;
  }
  .boton:hover { background: var(--line); }
  .boton svg { flex-shrink: 0; }
  .boton.activo { border-color: var(--accent); color: var(--accent); }
  .boton-principal { background: var(--accent); color: var(--on-accent); border-color: var(--accent); border-radius: var(--radius-full); padding: 0 20px; }
  .boton-principal:hover { background: var(--accent); filter: brightness(1.08); }

  /* ── Filtros: lo común a la vista ── */
  .filtros { padding: var(--space-3) 0 var(--space-2); }
  .filtro-fila { display: flex; align-items: center; gap: var(--space-2); min-height: 36px; margin-bottom: var(--space-2); }
  .filtro-nombre { flex-shrink: 0; font-size: 13px; color: var(--muted); min-width: 48px; }
  .filtro-linea { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: var(--space-4); }
  .filtro-linea > .chip { margin-bottom: var(--space-2); }
  .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; min-width: 0; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    min-height: 34px; padding: 6px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-full);
    font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap;
    transition: background .12s;
  }
  .chip:hover { background: var(--surface-raised); }
  .chip small { font: 400 11px/1 var(--font-mono); color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip.on small { color: var(--on-accent); }
  .chip:disabled { opacity: .4; cursor: default; background: none; }
  .chip-mas { border-style: dashed; color: var(--muted); }

  .pie-filtros { display: flex; align-items: center; gap: var(--space-3); min-height: 36px; margin-top: var(--space-1); flex-wrap: wrap; }
  .pie-filtros .dato { margin-right: auto; }
  .interruptor { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 14px; cursor: pointer; }
  .interruptor input { accent-color: var(--accent); width: 16px; height: 16px; }
  .orden { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius-s); font: 400 14px var(--font-sans); padding: 6px 8px; }
  .limpiar { color: var(--accent); font-weight: 600; font-size: 14px; }

  /* ── Portada ── */
  .destacada {
    display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    border: 1px solid var(--line); border-radius: var(--radius-m);
    overflow: hidden; margin: var(--space-3) 0 var(--space-5);
    background: var(--surface);
  }
  .destacada .miniatura { border-radius: 0; }
  .destacada-texto { padding: var(--space-4); display: flex; flex-direction: column; justify-content: center; gap: var(--space-2); }
  .destacada-texto h2 { font: 800 clamp(24px, 3vw, 36px)/1.05 var(--font-display); letter-spacing: -0.015em; }
  .destacada-texto p { color: var(--muted); font-size: 16px; line-height: 1.45; }
  .rotulo { font: 500 12px/1.45 var(--font-mono); color: var(--accent); }

  .fila { margin-bottom: var(--space-5); }
  .fila-cabeza { display: flex; align-items: center; gap: var(--space-3); margin-bottom: 12px; }
  .fila-cabeza h2 { font: 700 20px/1.15 var(--font-display); }
  .fila-cabeza .dato { flex: 1; }
  .ver-todas { color: var(--accent); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .flecha { width: 34px; height: 34px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .flecha:hover { background: var(--surface-raised); }
  .carril {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, calc((100% - 3 * var(--space-3)) / 4));
    gap: var(--space-3); overflow-x: auto; scroll-snap-type: x proximity;
    padding-bottom: var(--space-2); scrollbar-width: none;
  }
  .carril::-webkit-scrollbar { display: none; }
  .carril > * { scroll-snap-align: start; }

  /* ── Tarjeta: la miniatura grita, el resto acompaña ── */
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: var(--space-4) var(--space-3); padding: var(--space-2) 0 var(--space-5); }
  .tarjeta { display: block; min-width: 0; }
  .miniatura {
    position: relative; display: block; aspect-ratio: 16/9;
    border-radius: var(--radius-s); overflow: hidden;
    background: var(--surface-raised);
  }
  .miniatura img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .15s; }
  .tarjeta:hover .miniatura img { transform: scale(1.03); }
  .sello { position: absolute; bottom: 6px; right: 6px; background: rgba(4,8,13,.86); color: #d8f3ff; font: 400 12px/1 var(--font-mono); padding: 4px 6px; border-radius: 5px; }
  .sello-izq { right: auto; left: 6px; }
  .vista { position: absolute; inset: 0; background: rgba(4,8,13,.62); display: grid; place-items: center; color: #d8f3ff; font-weight: 600; font-size: 13px; }
  .vista span { display: inline-flex; align-items: center; gap: var(--space-1); }
  .tarjeta h3 { font-size: 15px; font-weight: 600; line-height: 1.25; margin: var(--space-2) 0 var(--space-1); }
  .tarjeta:hover h3 { color: var(--accent); }
  .tarjeta p { font-size: 13px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: var(--space-1); }
  .mencion { display: block; margin-top: var(--space-1); font-size: 13px; color: var(--ink); }
  mark { background: none; color: var(--accent); font-weight: 600; }

  .vacio { padding: var(--space-5) 0 80px; text-align: center; }
  .vacio h2 { font: 700 20px/1.15 var(--font-display); margin-bottom: var(--space-2); }
  .vacio p { color: var(--muted); margin-bottom: var(--space-3); }

  /* ── Episodio ── */
  .episodio { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--space-4); padding: var(--space-3) 0 var(--space-5); align-items: start; }
  .volver { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .volver:hover { color: var(--ink); }
  .reproductor { aspect-ratio: 16/9; background: #000; border-radius: var(--radius-s); overflow: hidden; }
  .reproductor iframe, .reproductor > div { width: 100%; height: 100%; border: 0; display: block; }
  .episodio h1 { font: 800 clamp(24px, 3.2vw, 32px)/1.05 var(--font-display); letter-spacing: -0.015em; margin: var(--space-3) 0 var(--space-1); }
  .acciones { display: flex; gap: var(--space-2); flex-wrap: wrap; margin: var(--space-3) 0; }
  .de-que { font-size: 16px; line-height: 1.5; max-width: 68ch; }
  .episodio h2 { font: 700 20px/1.15 var(--font-display); margin: var(--space-4) 0 12px; }
  .bonus { border: 1px solid var(--line); border-radius: var(--radius-m); padding: var(--space-3); background: var(--surface); max-width: 68ch; }
  .bonus p { font-size: 15px; line-height: 1.5; }
  .bonus .dato { display: block; margin-bottom: var(--space-1); }
  .datos-ep { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--space-3); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--line); }
  .datos-ep b { display: block; font-weight: 600; }
  .datos-ep span { font-size: 13px; color: var(--muted); }
  .lateral h2 { margin-top: 0; }
  .lista-mini { display: flex; flex-direction: column; gap: 12px; }
  .mini { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 12px; align-items: start; }
  .mini h3 { font-size: 14px; font-weight: 600; line-height: 1.25; margin: 0 0 var(--space-1); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mini:hover h3 { color: var(--accent); }
  .siguiente { display: block; margin-bottom: var(--space-4); padding: 12px; border: 1px solid var(--accent); border-radius: var(--radius-m); }
  .siguiente .rotulo { display: block; margin-bottom: var(--space-2); }

  /* ── Números ── */
  .numeros { padding: var(--space-4) 0 var(--space-5); max-width: 860px; }
  .numeros h1 { font: 800 32px/1.05 var(--font-display); margin-bottom: var(--space-4); }
  .numeros h2 { font: 700 20px/1.15 var(--font-display); margin: var(--space-5) 0 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); }
  .kpis b { display: block; font: 500 28px/1.1 var(--font-mono); color: var(--ink); }
  .kpis span { font-size: 13px; color: var(--muted); }
  .barra-dato { display: grid; grid-template-columns: 130px minmax(0, 1fr) 40px; gap: 12px; align-items: center; padding: 5px 0; border-radius: var(--radius-s); }
  .barra-dato:hover span:first-child { color: var(--accent); }
  .barra-dato i { display: block; height: 8px; background: var(--surface-raised); border-radius: 4px; overflow: hidden; }
  .barra-dato i::after { content: ''; display: block; height: 100%; width: var(--p); background: var(--accent); border-radius: 4px; }

  /* ── Pie y aviso ── */
  footer { border-top: 1px solid var(--line); padding: var(--space-4) 0 var(--space-5); }
  .firma { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .firma svg { width: 16px; height: 16px; flex-shrink: 0; }
  .firma a { text-decoration: underline; text-underline-offset: 2px; }
  .firma .sep { flex: 1; }
  .aviso {
    position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-m);
    box-shadow: 0 8px 28px rgba(0,0,0,.45); padding: 10px 16px; font-weight: 500; z-index: 40;
    max-width: calc(100vw - 32px);
  }
  .latido { animation: latido .5s ease-out; }
  @keyframes latido { 40% { transform: scale(1.18); } }

  @media (max-width: 760px) {
    .barra-fila { flex-wrap: wrap; height: auto; padding: 10px var(--space-3); gap: var(--space-2); }
    .logo { flex: 1; }
    .logo b { font-size: 20px; }
    .buscador { order: 3; flex: 1 0 100%; max-width: none; }
    /* La acción principal baja al alcance del pulgar. */
    .barra .boton-principal { position: fixed; right: var(--space-3); bottom: var(--space-3); height: 50px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
    body.en-episodio .barra .boton-principal { display: none; }
    .filtro-fila { min-width: 0; }
    .filtros { padding-top: 12px; }
    .filtro-linea { display: block; }
    .chips.corre { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--space-3)); padding: 2px var(--space-3) 2px 0; scrollbar-width: none; }
    .chips.corre::-webkit-scrollbar { display: none; }
    .destacada { grid-template-columns: 1fr; margin-top: var(--space-2); }
    .destacada-texto { padding: var(--space-3); }
    .destacada-texto p { font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .carril { grid-auto-columns: 74vw; margin: 0 calc(-1 * var(--space-3)); padding: 0 var(--space-3) var(--space-2); scroll-padding-left: var(--space-3); }
    .flecha, .fila-cabeza .dato { display: none; }
    .fila-cabeza h2 { flex: 1; }
    .grilla { grid-template-columns: 1fr; }
    .episodio { grid-template-columns: 1fr; padding-top: var(--space-2); }
    .acciones .boton { flex: 1 1 auto; }
    .barra-dato { grid-template-columns: 96px minmax(0, 1fr) 34px; }
    footer { padding-bottom: 88px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<script>
// ═══════════════════════════════════════════════════
// DATOS
// ═══════════════════════════════════════════════════
let EPISODES = [];
const EP_BY_ID = {};
let EXTRA = { lugares: {}, parecidas: {} };

const ANIMOS = {
  reir:     { nombre: 'Reírme',       arcos: ['cómico', 'absurdo'] },
  miedo:    { nombre: 'Asustarme',    arcos: ['terror'] },
  tension:  { nombre: 'Tensión',      arcos: ['dramático'] },
  emocion:  { nombre: 'Emocionarme',  arcos: ['emotivo'] }
};
const ANIMO_DE_ARCO = { 'cómico': 'Para reír', 'absurdo': 'Absurda', 'terror': 'Da miedo', 'dramático': 'Tensión', 'emotivo': 'Emotiva' };
const TIEMPOS = {
  corta: { nombre: 'Hasta 15 min', ok: s => s <= 900 },
  media: { nombre: '15 a 25 min',  ok: s => s > 900 && s <= 1500 },
  larga: { nombre: 'Más de 25',    ok: s => s > 1500 }
};
const LUGARES = {
  'buenos-aires':  'Buenos Aires',
  'interior':      'Interior',
  'latinoamerica': 'Latinoamérica',
  'mundo':         'Resto del mundo'
};
// "urbano" y "barrio" están en casi todo: no ayudan a elegir.
const TEMAS_AFUERA = new Set(['urban', 'urbano', 'barrio', 'generacional']);
const ORDENES = { recientes: 'Más nuevas', vistas: 'Más vistas', intensas: 'Más intensas', cortas: 'Más cortas' };

const fmt = n => n >= 1000000 ? (n/1000000).toFixed(1).replace('.', ',')+' M' : n >= 1000 ? Math.round(n/1000)+' mil' : String(n);
const mins = s => Math.max(1, Math.round(s/60)) + ' min';
const dur = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fecha = d => { const [y,m,day] = d.split('-'); return `${parseInt(day)} ${MESES[m-1]} ${y}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);

// "Anécdota #291  - REMISERO por un día" y "SAQUEO - Anécdotas #12" pasan a decir solo el título.
function tituloLimpio(t) {
  const limpio = t
    .replace(/^An[eé]cdotas?\s*#?\d+\s*[-–:|]*\s*/i, '')
    .replace(/\s*[-–|:]*\s*An[eé]cdotas?\s*#?\d+\s*$/i, '')
    .trim();
  return limpio || t;
}

async function cargar() {
  const [eps, extra] = await Promise.all([
    fetch('data/index.json').then(r => r.json()),
    fetch('data/explorar.json').then(r => r.ok ? r.json() : EXTRA).catch(() => EXTRA)
  ]);
  EPISODES = eps.sort((a,b) => b.published_date.localeCompare(a.published_date));
  EXTRA = extra;
  EPISODES.forEach(e => {
    EP_BY_ID[e.id] = e;
    const a = e.analysis;
    e.limpio = tituloLimpio(e.title);
    e.lugares = EXTRA.lugares[e.id] || [];
    e.temas = [...new Set(a.categories.map(c => c === 'urban' ? 'urbano' : c))];
    e.buscable = normal([e.limpio, e.episode_number, a.summary, a.categories.join(' '), a.geography.join(' '), a.archetypes.join(' '), (a.historical_events||[]).join(' '), a.bonus_track ? a.bonus_track.summary : ''].join(' '));
  });
  iniciarBuscador();
  ruta();
}

let F = {};
let LISTA_ACTUAL = [];

function leerFiltros(qs) {
  const p = new URLSearchParams(qs);
  const f = {};
  ['q','animo','tiempo','tema','lugar','orden','sin','guardadas','bonus','hecho'].forEach(k => { if(p.get(k)) f[k] = p.get(k); });
  return f;
}
function hashDe(f) {
  const limpio = Object.fromEntries(Object.entries(f).filter(([,v]) => v));
  const qs = new URLSearchParams(limpio).toString();
  return '#/' + (qs ? '?' + qs : '');
}
function irA(cambios) {
  const hash = hashDe({ ...F, ...cambios });
  if(location.hash === hash) ruta(); else location.hash = hash;
}

let scrollExplorar = 0;
let vistaActual = '';
let navegoAdentro = false;
function ruta() {
  if(!EPISODES.length) return;
  document.title = 'Anécdotas · Elegí la próxima historia';
  const h = location.hash.replace(/^#\/?/, '');
  const mostrar = v => {
    if(vistaActual === 'explorar' && v !== 'explorar') scrollExplorar = scrollY;
    ['explorar','episodio','numeros'].forEach(x => { document.getElementById('vista-'+x).hidden = x !== v; });
    document.body.classList.toggle('en-episodio', v === 'episodio');
    const venia = vistaActual; vistaActual = v;
    return venia;
  };
  if(h.startsWith('e/')) {
    mostrar('episodio');
    pintarEpisodio(h.slice(2));
    scrollTo(0,0);
    return;
  }
  if(h === 'numeros') { mostrar('numeros'); pintarNumeros(); scrollTo(0,0); return; }
  const venia = mostrar('explorar');
  F = leerFiltros(h.split('?')[1] || '');
  const q = document.getElementById('q');
  if((F.q || '') !== q.value.trim()) q.value = F.q || '';
  document.getElementById('borrar').hidden = !q.value;
  pintarExplorar();
  if(venia === 'episodio' || venia === 'numeros') scrollTo(0, scrollExplorar);
}
addEventListener('hashchange', () => { navegoAdentro = true; ruta(); });

// FILTRAR

function pasa(e, f, sinClave) {
  const a = e.analysis;
  if(f.animo && sinClave !== 'animo' && !(ANIMOS[f.animo]?.arcos || []).includes(a.emotional_arc)) return false;
  if(f.tiempo && sinClave !== 'tiempo' && !TIEMPOS[f.tiempo]?.ok(e.duration_seconds)) return false;
  if(f.tema && sinClave !== 'tema' && !e.temas.includes(f.tema)) return false;
  if(f.lugar && sinClave !== 'lugar' && !e.lugares.includes(f.lugar)) return false;
  if(f.sin && VISTAS.has(e.id)) return false;
  if(f.guardadas && !GUARDADAS.has(e.id)) return false;
  if(f.bonus && !a.bonus_track) return false;
  if(f.hecho && !(a.historical_events || []).length) return false;
  return true;
}
const hayFiltros = f => ['q','animo','tiempo','tema','lugar','orden','sin','guardadas','bonus','hecho'].some(k => f[k]);

function ordenar(lista, orden) {
  const s = [...lista];
  if(orden === 'vistas') s.sort((a,b) => b.views - a.views);
  else if(orden === 'intensas') s.sort((a,b) => b.analysis.intensity - a.analysis.intensity || b.views - a.views);
  else if(orden === 'cortas') s.sort((a,b) => a.duration_seconds - b.duration_seconds);
  else s.sort((a,b) => b.published_date.localeCompare(a.published_date));
  return s;
}

// BUSCAR: en lo que se resume y en lo que se dice
// ═══════════════════════════════════════════════════
let fuse;
let DICHO = null;       // palabra normalizada → índices de episodio. Se baja al primer uso.
let bajandoDicho = null;

function iniciarBuscador() {
  fuse = new Fuse(EPISODES, {
    keys: ['buscable'],
    threshold: 0.2,
    ignoreLocation: true,
    minMatchCharLength: 3
  });
}
function bajarDicho() {
  if(!bajandoDicho) {
    bajandoDicho = fetch('data/busqueda.json').then(r => r.json()).then(d => {
      DICHO = { ids: d.ids, palabras: d.palabras };
      if(F.q && vistaActual === 'explorar') pintarExplorar();
    }).catch(() => {});
  }
  return bajandoDicho;
}

// Episodios donde se dicen todas las palabras de la búsqueda.
function episodiosDonde(palabras) {
  if(!DICHO || !palabras.length) return { ids: new Set(), palabras: [] };
  let cruce = null;
  const usadas = [];
  for(const p of palabras) {
    // Desde cinco letras también vale el plural y el femenino: camionero, camioneros, camionera.
    const claves = p.length >= 5 ? Object.keys(DICHO.palabras).filter(k => k.startsWith(p.slice(0, -1)) && k.length <= p.length + 2) : [p];
    const listas = claves.map(k => DICHO.palabras[k]).filter(Boolean);
    if(!listas.length) { if(p.length >= 5) { cruce = new Set(); usadas.push(p); } continue; }   // lo muy común no filtra
    usadas.push(p);
    const s = new Set(listas.flat().map(i => DICHO.ids[i]));
    cruce = cruce ? new Set([...cruce].filter(x => s.has(x))) : s;
  }
  return { ids: cruce || new Set(), palabras: usadas };
}

function buscar(q) {
  const norm = normal(q).trim();
  const palabras = norm.split(/\s+/).filter(p => p.length >= 3);
  const directo = EPISODES.filter(e => palabras.length && palabras.every(p => e.buscable.includes(p)));
  const directoIds = new Set(directo.map(e => e.id));
  const dicho = episodiosDonde(palabras.filter(p => p.length >= 4));
  // Lo difuso rescata errores de tipeo. Si hay coincidencias exactas, solo agregaría ruido.
  const difuso = directo.length + dicho.ids.size < 3 && norm.length >= 3 ? fuse.search(norm).map(r => r.item).filter(e => !directoIds.has(e.id)) : [];
  const resumenIds = new Set([...directoIds, ...difuso.map(e => e.id)]);
  const soloDicho = [...dicho.ids].filter(id => !resumenIds.has(id) && EP_BY_ID[id]).map(id => EP_BY_ID[id]);
  soloDicho.sort((a,b) => b.views - a.views);
  return { resumen: [...directo, ...difuso], dicho: soloDicho, palabras };
}

function resaltar(texto, palabras) {
  let salida = esc(texto);
  if(!palabras || !palabras.length) return salida;
  const n = normal(salida);
  if(n.length !== salida.length) return salida;
  const marcas = [];
  palabras.forEach(p => {
    let i = n.indexOf(p);
    while(i >= 0) { marcas.push([i, i + p.length]); i = n.indexOf(p, i + p.length); }
  });
  marcas.sort((a,b) => b[0] - a[0]);
  let fin = Infinity;
  marcas.forEach(([a,b]) => {
    if(b > fin) return;
    salida = salida.slice(0,a) + '<mark>' + salida.slice(a,b) + '</mark>' + salida.slice(b);
    fin = a;
  });
  return salida;
}

const ICONO_TILDE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>';
const ICONO_MARCA = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

// mqdefault viene en 16:9, sin las bandas negras de hqdefault. Si no carga, queda el fondo con el número.
function miniatura(ep, conDuracion = true, grande = false) {
  return `<span class="miniatura">
    <img src="https://i.ytimg.com/vi/${ep.id}/${grande ? 'hqdefault' : 'mqdefault'}.jpg" alt="" loading="${grande ? 'eager' : 'lazy'}" decoding="async" onerror="this.remove()" onload="if(this.naturalWidth<=120)this.remove()">
    <span class="sello sello-izq" style="bottom:auto;top:6px;z-index:1">#${ep.episode_number}</span>
    ${conDuracion ? `<span class="sello">${dur(ep.duration_seconds)}</span>` : ''}
    ${VISTAS.has(ep.id) ? `<span class="vista"><span>${ICONO_TILDE} Ya la viste</span></span>` : ''}
  </span>`;
}

function tarjeta(ep, op = {}) {
  const texto = op.bonus ? ep.analysis.bonus_track.summary : ep.analysis.summary;
  const meta = op.bonus
    ? `Bonus del #${ep.episode_number}`
    : `${ANIMO_DE_ARCO[ep.analysis.emotional_arc] || ''} · ${mins(ep.duration_seconds)}`;
  return `<a class="tarjeta" href="#/e/${ep.id}">
    ${miniatura(ep, !op.bonus)}
    <h3>${resaltar(ep.limpio, op.palabras)}</h3>
    <p>${resaltar(texto, op.palabras)}</p>
    ${op.dicho ? `<span class="mencion">Se menciona <mark>${esc(op.dicho.join(', '))}</mark> en el episodio</span>` : ''}
    <div class="dato meta">${meta}</div>
  </a>`;
}

function chip(texto, activo, destino, cuenta, extraClase = '') {
  const apagado = !activo && cuenta === 0;
  return `<button class="chip ${activo ? 'on' : ''} ${extraClase}" aria-pressed="${activo}" ${apagado ? 'disabled' : ''} onclick='irA(${JSON.stringify(destino)})'>${esc(texto)}${cuenta != null ? `<small>${cuenta}</small>` : ''}</button>`;
}

let masFiltros = false;
function pintarFiltros() {
  const base = listaConBusqueda();
  const conteo = (clave, prueba) => base.filter(e => pasa(e, F, clave) && prueba(e)).length;

  const animos = Object.entries(ANIMOS).map(([k,v]) => chip(v.nombre, F.animo===k, {animo: F.animo===k ? '' : k}, conteo('animo', e => v.arcos.includes(e.analysis.emotional_arc)))).join('');
  const tiempos = Object.entries(TIEMPOS).map(([k,v]) => chip(v.nombre, F.tiempo===k, {tiempo: F.tiempo===k ? '' : k}, conteo('tiempo', e => v.ok(e.duration_seconds)))).join('');
  const lugares = Object.entries(LUGARES).map(([k,v]) => chip(v, F.lugar===k, {lugar: F.lugar===k ? '' : k}, conteo('lugar', e => e.lugares.includes(k)))).join('');

  const cuentas = {};
  EPISODES.forEach(e => e.temas.forEach(t => { if(!TEMAS_AFUERA.has(t)) cuentas[t] = (cuentas[t]||0)+1; }));
  const temas = Object.keys(cuentas).sort((a,b) => cuentas[b]-cuentas[a]);
  const chipsTemas = temas.map(t => chip(mayus(t), F.tema===t, {tema: F.tema===t ? '' : t}, conteo('tema', e => e.temas.includes(t)))).join('');

  const conVistas = VISTAS.size > 0;
  const conGuardadas = GUARDADAS.size > 0;
  const abierto = masFiltros || F.tema || F.lugar;
  document.getElementById('filtros').innerHTML = `
    <div class="filtro-linea">
      <div class="filtro-fila"><span class="filtro-nombre">Quiero</span><div class="chips corre">${animos}</div></div>
      <div class="filtro-fila"><span class="filtro-nombre">Tengo</span><div class="chips corre">${tiempos}</div></div>
      <button class="chip chip-mas" aria-expanded="${!!abierto}" onclick="masFiltros=!masFiltros;pintarFiltros()">${abierto ? 'Menos filtros' : 'Tema y lugar'}</button>
    </div>
    ${abierto ? `<div class="filtro-fila"><span class="filtro-nombre">Pasó en</span><div class="chips corre">${lugares}</div></div>
    <div class="filtro-fila"><span class="filtro-nombre">De qué</span><div class="chips">${chipsTemas}</div></div>` : ''}
    ${(conVistas || conGuardadas) ? `<div class="filtro-fila"><span class="filtro-nombre">Mías</span><div class="chips">
      ${conVistas ? `<label class="interruptor"><input type="checkbox" ${F.sin ? 'checked' : ''} onchange="irA({sin:this.checked?'1':''})"> Sin las que vi (${VISTAS.size})</label>` : ''}
      ${conGuardadas ? chip('Guardadas', !!F.guardadas, {guardadas: F.guardadas ? '' : '1'}, GUARDADAS.size) : ''}
    </div></div>` : ''}`;
}

function listaConBusqueda() {
  if(!F.q) return EPISODES;
  const r = buscar(F.q);
  return [...r.resumen, ...r.dicho];
}

function encabezadoResultados(n) {
  const orden = F.orden || 'recientes';
  return `<div class="pie-filtros">
    <span class="dato" id="cuantas">${n} ${n === 1 ? 'historia' : 'historias'}</span>
    ${hayFiltros(F) ? `<button class="limpiar" onclick="location.hash='#/'">Limpiar todo</button>` : ''}
    ${F.q ? '' : `<label class="interruptor">Orden
      <select class="orden" onchange="irA({orden:this.value})">
        ${Object.entries(ORDENES).map(([k,v]) => `<option value="${k}" ${k===orden ? 'selected' : ''}>${v}</option>`).join('')}
      </select></label>`}
  </div>`;
}

function pintarExplorar() {
  pintarFiltros();
  const c = document.getElementById('contenido');
  if(!hayFiltros(F)) {
    LISTA_ACTUAL = EPISODES;
    c.innerHTML = portada();
    return;
  }

  let html;
  if(F.q) {
    const r = buscar(F.q);
    const resumen = r.resumen.filter(e => pasa(e, F));
    const dicho = r.dicho.filter(e => pasa(e, F));
    LISTA_ACTUAL = [...resumen, ...dicho];
    const usadas = r.palabras.filter(p => p.length >= 4);
    html = encabezadoResultados(LISTA_ACTUAL.length);
    if(resumen.length) html += `<div class="grilla">${resumen.map(e => tarjeta(e, {palabras: r.palabras})).join('')}</div>`;
    if(dicho.length) html += `<section class="fila"><div class="fila-cabeza"><h2>También lo nombran en estas</h2></div><div class="grilla">${dicho.map(e => tarjeta(e, {dicho: usadas})).join('')}</div></section>`;
    if(!DICHO) bajarDicho();
  } else {
    LISTA_ACTUAL = ordenar(EPISODES.filter(e => pasa(e, F)), F.orden);
    html = encabezadoResultados(LISTA_ACTUAL.length);
    if(LISTA_ACTUAL.length) html += `<div class="grilla">${LISTA_ACTUAL.map(e => tarjeta(e, {bonus: !!F.bonus})).join('')}</div>`;
  }
  if(!LISTA_ACTUAL.length) {
    html += `<div class="vacio"><h2>No hay ninguna así</h2><p>${F.q && !DICHO ? 'Sigo buscando adentro de los episodios…' : 'Probá con otra palabra o sacá un filtro.'}</p><button class="boton" onclick="location.hash='#/'">Limpiar todo</button></div>`;
  }
  c.innerHTML = html;
}

// ── Portada: abrir ya mostrando qué ver ──
function delDia(lista) {
  const hoy = new Date();
  const n = hoy.getFullYear()*1000 + Math.floor((hoy - new Date(hoy.getFullYear(),0,0)) / 864e5);
  return lista[(n * 2654435761 >>> 0) % lista.length];
}

function carril(titulo, detalle, destino, eps, op = {}) {
  if(!eps.length) return '';
  const id = 'c' + normal(titulo).replace(/[^a-z]/g,'');
  const flecha = (dir, d) => `<button class="flecha" aria-label="${dir < 0 ? 'Anteriores' : 'Siguientes'}" onclick="const c=document.getElementById('${id}');c.scrollBy({left:${dir}*c.clientWidth*.8,behavior:'smooth'})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg></button>`;
  return `<section class="fila">
    <div class="fila-cabeza">
      <h2>${esc(titulo)}</h2>
      <span class="dato">${esc(detalle)}</span>
      ${destino ? `<a class="ver-todas" href="${hashDe(destino)}">Ver todas</a>` : ''}
      ${flecha(-1,'m15 5-7 7 7 7')}${flecha(1,'m9 5 7 7-7 7')}
    </div>
    <div class="carril" id="${id}">${eps.map(e => tarjeta(e, op)).join('')}</div>
  </section>`;
}

function portada() {
  const noVistas = EPISODES.filter(e => !VISTAS.has(e.id));
  const fuertes = noVistas.filter(e => e.analysis.intensity >= 8 && ['alta','muy alta'].includes(e.analysis.credibility));
  const hoy = delDia(fuertes.length ? fuertes : EPISODES);
  const de = arcos => noVistas.filter(e => arcos.includes(e.analysis.emotional_arc));
  const porVistas = l => [...l].sort((a,b) => b.views - a.views);
  const guardadas = EPISODES.filter(e => GUARDADAS.has(e.id));
  const bonus = EPISODES.filter(e => e.analysis.bonus_track);
  const conHistoria = noVistas.filter(e => (e.analysis.historical_events||[]).filter(h => h !== 'pandemia').length);
  const totalHoras = Math.round(EPISODES.reduce((s,e) => s + e.duration_seconds, 0) / 3600);

  return `
    <section class="destacada">
      <a class="tarjeta" href="#/e/${hoy.id}">${miniatura(hoy, true, true)}</a>
      <div class="destacada-texto">
        <span class="rotulo">La de hoy · ${ANIMO_DE_ARCO[hoy.analysis.emotional_arc]} · ${mins(hoy.duration_seconds)}</span>
        <h2><a href="#/e/${hoy.id}">${esc(hoy.limpio)}</a></h2>
        <p>${esc(hoy.analysis.summary)}</p>
        <div class="dato">${EPISODES.length} episodios, ${bonus.length} bonus y ${totalHoras} horas para elegir</div>
      </div>
    </section>
    ${carril('Guardadas', 'Para ver después', {guardadas:'1'}, guardadas)}
    ${carril('Las últimas', 'Recién salidas', {orden:'recientes'}, noVistas.slice(0,14))}
    ${carril('Para no dormir', 'Terror de la más fuerte a la menos', {animo:'miedo', orden:'intensas'}, de(['terror']).sort((a,b)=>b.analysis.intensity-a.analysis.intensity).slice(0,14))}
    ${carril('Para reírte', 'Las más vistas', {animo:'reir', orden:'vistas'}, porVistas(de(['cómico','absurdo'])).slice(0,14))}
    ${carril('Historias escondidas', 'Los bonus que no están en ningún título', {bonus:'1'}, bonus.slice(0,14), {bonus:true})}
    ${carril('Cortitas', 'Hasta 15 minutos', {tiempo:'corta', orden:'vistas'}, porVistas(noVistas.filter(e => TIEMPOS.corta.ok(e.duration_seconds))).slice(0,14))}
    ${carril('Con la historia de fondo', 'Malvinas, la dictadura, el 2001, el Holocausto', {hecho:'1'}, conHistoria.slice(0,14))}
    ${carril('Las más vistas', 'De todos los tiempos', {orden:'vistas'}, porVistas(EPISODES).slice(0,14))}
  `;
}

  const parecidas = (EXTRA.parecidas[id] || []).map(i => EP_BY_ID[i]).filter(Boolean);
  const eventos = (a.historical_events || []);
  const tags = [...ep.temas.filter(t => !TEMAS_AFUERA.has(t)).map(t => [mayus(t), {tema:t}]), ...ep.lugares.map(l => [LUGARES[l], {lugar:l}])];

  c.innerHTML = `
    <div class="episodio">
      <article>
        <a class="volver" href="#/" onclick="if(navegoAdentro){event.preventDefault();history.back()}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Volver</a>
        <div class="reproductor"><div id="yt"></div></div>
        <h1>${esc(ep.limpio)}</h1>
        <div class="dato">#${ep.episode_number} · ${fecha(ep.published_date)} · ${mins(ep.duration_seconds)} · ${fmt(ep.views)} vistas</div>
        <div class="acciones">
          <button class="boton ${VISTAS.has(id) ? 'activo' : ''}" id="b-vista" aria-pressed="${VISTAS.has(id)}" onclick="alternarVista('${id}')">${ICONO_TILDE}<span>${VISTAS.has(id) ? 'Ya la vi' : 'Marcar como vista'}</span></button>
          <button class="boton ${GUARDADAS.has(id) ? 'activo' : ''}" id="b-guardar" aria-pressed="${GUARDADAS.has(id)}" onclick="alternarGuardada('${id}')">${ICONO_MARCA}<span>${GUARDADAS.has(id) ? 'Guardada' : 'Guardar'}</span></button>
          <button class="boton" onclick="compartir('${id}')">Compartir</button>
          <a class="boton" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Abrir en YouTube</a>
        </div>
        <p class="de-que">${esc(a.summary)}</p>
        ${a.bonus_track ? `<h2>Y además, el bonus</h2>
        <div class="bonus"><span class="dato">${ANIMO_DE_ARCO[a.bonus_track.emotional_arc] || ''}</span><p>${esc(a.bonus_track.summary)}</p></div>` : ''}
        ${tags.length ? `<h2>Más de esto</h2><div class="chips">${tags.map(([t,d]) => `<a class="chip" href="${hashDe(d)}">${esc(t)}</a>`).join('')}</div>` : ''}
        <div class="datos-ep">
          <div><b>${esc(mayus(a.era))}</b><span>Cuándo pasó</span></div>
          ${a.geography.length ? `<div><b>${esc(a.geography.slice(0,3).join(', '))}</b><span>Dónde</span></div>` : ''}
          <div><b>${a.intensity} de 10</b><span>Intensidad</span></div>
          ${eventos.length ? `<div><b>${esc(eventos.join(', '))}</b><span>De fondo</span></div>` : ''}
        </div>
      </article>
      <aside class="lateral">
        ${sig ? `<a class="siguiente" id="siguiente" href="#/e/${sig.id}">
          <span class="rotulo">Sigue</span>
          <div class="mini">${miniatura(sig)}<div><h3>${esc(sig.limpio)}</h3><div class="dato">${ANIMO_DE_ARCO[sig.analysis.emotional_arc]} · ${mins(sig.duration_seconds)}</div></div></div>
        </a>` : ''}
        ${parecidas.length ? `<h2>Se parecen</h2>
        <div class="lista-mini">${parecidas.map(e => `<a class="mini tarjeta" href="#/e/${e.id}">${miniatura(e)}<div><h3>${esc(e.limpio)}</h3><div class="dato">${ANIMO_DE_ARCO[e.analysis.emotional_arc]} · ${mins(e.duration_seconds)}</div></div></a>`).join('')}</div>` : ''}
      </aside>
    </div>`;
  montarReproductor(id, sig);
}

// La API de YouTube avisa cuando termina el video: ahí queda vista y se ofrece la siguiente.
function montarReproductor(id, sig) {
  const crear = () => {
    if(!document.getElementById('yt')) return;
    reproductorYT = new YT.Player('yt', {
      videoId: id,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: { onStateChange: ev => { if(ev.data === YT.PlayerState.ENDED) alTerminar(id, sig); } }
    });
  };
  if(window.YT && YT.Player) return crear();
  window.onYouTubeIframeAPIReady = crear;
  if(!document.getElementById('yt-api')) {
    const s = document.createElement('script');
    s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => {
      const d = document.getElementById('yt');
      if(d) d.outerHTML = `<iframe src="https://www.youtube.com/embed/${id}" allow="encrypted-media; picture-in-picture" allowfullscreen title="Video"></iframe>`;
    };
    document.head.appendChild(s);
  }
}
function alTerminar(id, sig) {
  if(!VISTAS.has(id)) alternarVista(id);
  if(sig) avisar(`Sigue: ${sig.limpio}`);
}

function pintarBoton(bid, activo, texto) {
  const b = document.getElementById(bid);
  if(!b) return;
  b.classList.toggle('activo', activo);
  b.setAttribute('aria-pressed', activo);
  b.querySelector('span').textContent = texto;
}
function alternarVista(id) {
  if(VISTAS.has(id)) VISTAS.delete(id); else { VISTAS.add(id); latir(); }
  guardarLista('anecdotas_vistas', VISTAS);
  pintarBoton('b-vista', VISTAS.has(id), VISTAS.has(id) ? 'Ya la vi' : 'Marcar como vista');
}
function alternarGuardada(id) {
  if(GUARDADAS.has(id)) GUARDADAS.delete(id); else { GUARDADAS.add(id); latir(); }
  guardarLista('anecdotas_guardadas', GUARDADAS);
  pintarBoton('b-guardar', GUARDADAS.has(id), GUARDADAS.has(id) ? 'Guardada' : 'Guardar');
}
async function compartir(id) {
  const ep = EP_BY_ID[id];
  const url = location.href.split('#')[0] + '#/e/' + id;
  try {
    if(navigator.share) { await navigator.share({ title: ep.limpio, url }); return; }
    await navigator.clipboard.writeText(url);
    avisar('Link copiado');
  } catch(e) {
    if(e.name !== 'AbortError') avisar('No se pudo copiar. Copiá la dirección de arriba.');
  }
}

// ═══════════════════════════════════════════════════
// NÚMEROS
// ═══════════════════════════════════════════════════
function pintarNumeros() {
  document.title = 'El archivo en números · Anécdotas';
  const c = document.getElementById('vista-numeros');
  const barras = (pares, destino) => {
    const tope = Math.max(...pares.map(p => p[1]), 1);
    return pares.map(([n,v,k]) => `<a class="barra-dato" href="${hashDe(destino(k ?? n))}"><span>${esc(mayus(n))}</span><i style="--p:${v/tope*100}%"></i><span class="dato">${v}</span></a>`).join('');
  };
  const cuentaTemas = {};
  EPISODES.forEach(e => e.temas.forEach(t => { if(!TEMAS_AFUERA.has(t)) cuentaTemas[t] = (cuentaTemas[t]||0)+1; }));
  const temas = Object.entries(cuentaTemas).sort((a,b) => b[1]-a[1]).slice(0,10);
  const animos = Object.entries(ANIMOS).map(([k,v]) => [v.nombre, EPISODES.filter(e => v.arcos.includes(e.analysis.emotional_arc)).length, k]).sort((a,b) => b[1]-a[1]);
  const lugares = Object.entries(LUGARES).map(([k,v]) => [v, EPISODES.filter(e => e.lugares.includes(k)).length, k]).sort((a,b) => b[1]-a[1]);
  const horas = Math.round(EPISODES.reduce((s,e) => s+e.duration_seconds, 0) / 3600);
  c.innerHTML = `<div class="numeros">
    <a class="volver" href="#/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Volver</a>
    <h1>El archivo en números</h1>
    <div class="kpis">
      <div><b>${EPISODES.length}</b><span>episodios</span></div>
      <div><b>${EPISODES.filter(e=>e.analysis.bonus_track).length}</b><span>bonus</span></div>
      <div><b>${horas} h</b><span>de historias</span></div>
      <div><b>${fmt(EPISODES.reduce((s,e)=>s+e.views,0))}</b><span>reproducciones</span></div>
    </div>
    <h2>Por ganas</h2>${barras(animos, k => ({animo:k}))}
    <h2>Por tema</h2>${barras(temas, k => ({tema:k}))}
    <h2>Por lugar</h2>${barras(lugares, k => ({lugar:k}))}
  </div>`;
}

// ═══════════════════════════════════════════════════
// CONTROLES DE LA BARRA
// ═══════════════════════════════════════════════════
const inputQ = document.getElementById('q');
let _searchTimer;
inputQ.addEventListener('focus', bajarDicho);
inputQ.addEventListener('input', () => {
  const q = inputQ.value;
  document.getElementById('borrar').hidden = !q;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    if(q.length > 2) trackEvent(null, null, 'search', { query: q });
    const h = hashDe({ ...(vistaActual === 'explorar' ? F : {}), q: q.trim() });
    history.replaceState(null, '', h);
    ruta();
  }, 180);
});
document.getElementById('borrar').addEventListener('click', () => {
  inputQ.value = ''; document.getElementById('borrar').hidden = true;
  irA({ q: '' }); inputQ.focus();
});
addEventListener('keydown', ev => {
  const escribiendo = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(ev.key === '/' && !escribiendo) { ev.preventDefault(); inputQ.focus(); inputQ.select(); }
  if(ev.key === 'Escape' && document.activeElement === inputQ) { inputQ.blur(); if(inputQ.value) document.getElementById('borrar').click(); }
});
document.getElementById('sorprendeme').addEventListener('click', () => {
  // Respeta los filtros puestos: "una de terror corta que no vi" es exactamente esto.
  const base = vistaActual === 'explorar' && hayFiltros(F) ? LISTA_ACTUAL : EPISODES;
  const noVistas = base.filter(e => !VISTAS.has(e.id));
  const lista = noVistas.length ? noVistas : base;
  if(!lista.length) return;
  const ep = lista[Math.floor(Math.random() * lista.length)];
  trackEvent(ep.id, ep.episode_number, 'filter', { sorpresa: true });
  location.hash = '#/e/' + ep.id;
});

cargar();
trackEvent(null, null, 'session_start');
</script>
