<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anécdotas — Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
  const SUPA_URL = 'https://pcdeycvvhleigsxzloqd.supabase.co';
  const SUPA_KEY = 'sb_publishable_Nx-X2sKGB3KXuvGQvsMdlw_VruQ27vW';
  function trackEvent(episodeId, episodeNumber, action, metadata) {
    fetch(`${SUPA_URL}/rest/v1/events`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,
        'Authorization': `Bearer ${SUPA_KEY}`
      },
      body: JSON.stringify({ episode_id: episodeId, episode_number: episodeNumber, action, metadata: metadata || null })
    }).catch(() => {});
  }
</script>
<style>
  :root {
    --bg: #0e0d0b;
    --bg2: #161511;
    --bg3: #1e1d19;
    --bg4: #252420;
    --border: rgba(255,255,255,0.07);
    --gold: oklch(76% 0.14 78);
    --gold-dim: oklch(76% 0.14 78 / 0.15);
    --gold-glow: oklch(76% 0.14 78 / 0.06);
    --crimson: oklch(52% 0.22 22);
    --crimson-dim: oklch(52% 0.22 22 / 0.15);
    --text: #ede9e0;
    --text-dim: rgba(237,233,224,0.5);
    --text-muted: rgba(237,233,224,0.28);
    --nav-h: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--nav-h);
    background: rgba(14,13,11,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 28px;
    z-index: 100;
    gap: 0;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--text);
    flex: 1;
    cursor: pointer;
  }
  .nav-logo span { color: var(--gold); }

  .nav-links {
    display: flex;
    gap: 4px;
  }
  .nav-link {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    border: none; background: none;
    letter-spacing: 0.01em;
  }
  .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-link.active { color: var(--gold); background: var(--gold-dim); }

  /* ── MAIN ── */
  main {
    padding-top: var(--nav-h);
    min-height: 100vh;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ── FEED ── */
  .feed-header {
    padding: 52px 28px 32px;
    border-bottom: 1px solid var(--border);
  }
  .feed-title {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 6px;
  }
  .feed-title em { color: var(--gold); font-style: italic; }
  .feed-sub { font-size: 14px; color: var(--text-dim); }

  .filters-bar {
    padding: 18px 28px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    position: sticky;
    top: var(--nav-h);
    z-index: 50;
  }

  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  select.filter-select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  select.filter-select:hover { border-color: rgba(255,255,255,0.15); }
  select.filter-select:focus { border-color: var(--gold); }

  .filter-sep { width: 1px; height: 20px; background: var(--border); }

  .sort-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-dim);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 6px 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .sort-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .sort-btn:hover:not(.active) { color: var(--text); border-color: rgba(255,255,255,0.15); }

  .results-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }

  .episode-card {
    background: var(--bg);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .episode-card:hover { background: var(--bg2); }
  .episode-card:hover .card-thumb-overlay { opacity: 1; }

  .card-thumb {
    width: 100%; aspect-ratio: 16/9;
    position: relative;
    overflow: hidden;
  }

  .thumb-bg {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 900;
    color: rgba(255,255,255,0.12);
    position: relative;
  }

  .card-thumb-overlay {
    position: absolute; inset: 0;
    background: rgba(14,13,11,0.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .play-btn {
    width: 48px; height: 48px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn svg { margin-left: 3px; }

  .ep-badge {
    position: absolute; top: 10px; left: 10px;
    background: rgba(14,13,11,0.85);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px; font-weight: 600;
    padding: 2px 7px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    backdrop-filter: blur(4px);
  }

  .duration-badge {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(14,13,11,0.85);
    border-radius: 4px;
    font-size: 11px; font-weight: 600;
    padding: 2px 7px;
    color: var(--text);
    backdrop-filter: blur(4px);
  }

  .twist-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--crimson);
    border-radius: 4px;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px;
    color: #fff;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .bonus-badge {
    position: absolute; top: 10px; right: 10px;
    background: oklch(45% 0.15 250);
    border-radius: 4px;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px;
    color: #fff;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .twist-badge + .bonus-badge,
  .bonus-badge + .twist-badge {
    top: 32px;
  }

  .card-body { padding: 14px 16px 16px; }

  .card-cats {
    display: flex; gap: 5px; flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .tag {
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s;
    border: 1px solid transparent;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .card-summary {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.55;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--text-muted);
  }

  .intensity-bar {
    flex: 1; height: 3px;
    background: var(--bg4); border-radius: 2px;
    overflow: hidden;
    max-width: 60px;
  }
  .intensity-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold), var(--crimson));
  }

  .arc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ── EPISODE DETAIL ── */
  .episode-hero {
    padding: 40px 28px 32px;
    max-width: 960px;
    margin: 0 auto;
  }

  .ep-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    cursor: pointer; margin-bottom: 28px;
    border: none; background: none;
    transition: color 0.15s;
  }
  .ep-back:hover { color: var(--text); }

  .ep-player {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
    border: 1px solid var(--border);
  }
  .ep-player iframe { width: 100%; height: 100%; border: none; }
  .ep-player-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    font-size: 14px; color: var(--text-dim);
  }

  .ep-meta-row {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 12px;
  }
  .ep-num { color: var(--gold); font-size: 13px; font-weight: 600; }
  .ep-date { font-size: 13px; color: var(--text-muted); }

  .ep-title-large {
    font-family: 'Playfair Display', serif;
    font-size: 34px; font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 20px;
  }

  .ep-stats-row {
    display: flex; gap: 24px; margin-bottom: 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .ep-stat { display: flex; flex-direction: column; gap: 2px; }
  .ep-stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .ep-stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; }

  .ep-two-col {
    display: grid; grid-template-columns: 1fr 320px; gap: 28px;
    padding-bottom: 40px;
  }

  .ep-section-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .ep-summary-text {
    font-size: 16px; line-height: 1.7;
    color: var(--text);
    margin-bottom: 24px;
  }

  .ep-sidebar {
    display: flex; flex-direction: column; gap: 20px;
  }

  .analysis-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .analysis-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .analysis-row:last-child { border-bottom: none; }
  .analysis-row-key { color: var(--text-dim); }
  .analysis-row-val { font-weight: 600; text-align: right; max-width: 180px; }

  .intensity-large {
    display: flex; align-items: center; gap: 10px;
  }
  .intensity-track {
    flex: 1; height: 6px; background: var(--bg4);
    border-radius: 3px; overflow: hidden;
  }
  .intensity-thumb {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--crimson));
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .tags-cloud { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ── STATS ── */
  .stats-container { padding: 40px 28px; max-width: 1100px; margin: 0 auto; }

  .stats-header {
    margin-bottom: 40px;
  }
  .stats-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 900;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }
  .stats-title em { color: var(--gold); font-style: italic; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .stats-grid-wide { grid-column: 1 / -1; }

  .stat-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  .stat-panel-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .bar-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .bar-label { width: 130px; color: var(--text-dim); flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
  .bar-value { width: 50px; color: var(--text-dim); font-size: 12px; }

  .arc-legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .arc-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
  }
  .arc-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  .top10-list { display: flex; flex-direction: column; gap: 8px; }
  .top10-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--bg3);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .top10-item:hover { background: var(--bg4); }
  .top10-rank { font-size: 18px; font-weight: 900; color: var(--text-muted); width: 28px; flex-shrink: 0; font-family: 'Playfair Display', serif; }
  .top10-info { flex: 1; }
  .top10-ep-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .top10-ep-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .top10-value { font-size: 13px; font-weight: 700; color: var(--gold); }

  .geo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }
  .geo-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .geo-name { font-size: 13px; font-weight: 600; }
  .geo-count { font-size: 11px; color: var(--text-muted); }
  .geo-bar { height: 3px; background: var(--bg4); border-radius: 2px; margin-top: 4px; }
  .geo-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
  }
  .kpi-value {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 4px;
  }
  .kpi-label { font-size: 12px; color: var(--text-muted); }

  /* ── SEARCH ── */
  .search-container { padding: 40px 28px; max-width: 860px; margin: 0 auto; }

  .search-header { margin-bottom: 32px; }
  .search-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 900;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }
  .search-title em { color: var(--gold); font-style: italic; }
  .search-sub { font-size: 14px; color: var(--text-dim); }

  .search-box-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .search-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 400;
    padding: 16px 50px 16px 20px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }
  .search-icon {
    position: absolute; right: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }

  .search-filters {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .search-results { display: flex; flex-direction: column; gap: 3px; }

  .search-result {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex; gap: 16px;
  }
  .search-result:hover { background: var(--bg3); border-color: rgba(255,255,255,0.12); }

  .search-thumb {
    width: 100px; height: 56px;
    border-radius: 5px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 900;
    color: rgba(255,255,255,0.15);
  }

  .search-result-body { flex: 1; }
  .search-result-ep { font-size: 11px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
  .search-result-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .search-result-summary { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  mark { background: var(--gold-dim); color: var(--gold); border-radius: 2px; padding: 0 2px; }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted); font-size: 14px;
  }
  .empty-state .empty-icon {
    font-family: 'Playfair Display', serif;
    font-size: 48px; font-weight: 900;
    color: var(--bg4);
    margin-bottom: 12px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="navigate('feed')">Anécdotas <span>Explorer</span></div>
  <div class="nav-links">
    <button class="nav-link active" id="nav-feed" onclick="navigate('feed')">Episodios</button>
    <button class="nav-link" id="nav-stats" onclick="navigate('stats')">Stats</button>
    <button class="nav-link" id="nav-search" onclick="navigate('search')">Buscar</button>
  </div>
</nav>

<main>
  <!-- ── FEED VIEW ── -->
  <div class="view active" id="view-feed">
    <div class="feed-header">
      <div class="feed-title">Archivo de <em>Anécdotas</em></div>
      <div class="feed-sub">+200 episodios · historias reales de la gente</div>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <span class="filter-label">Categoría</span>
        <select class="filter-select" id="filter-cat" onchange="applyFilters()">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-sep"></div>
      <div class="filter-group">
        <span class="filter-label">Arco</span>
        <select class="filter-select" id="filter-arc" onchange="applyFilters()">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="filter-sep"></div>
      <div class="filter-group">
        <span class="filter-label">Zona</span>
        <select class="filter-select" id="filter-geo" onchange="applyFilters()">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-sep"></div>
      <div class="filter-group">
        <span class="filter-label">Ordenar</span>
        <button class="sort-btn active" id="sort-recent" onclick="setSort('recent')">Recientes</button>
        <button class="sort-btn" id="sort-views" onclick="setSort('views')">Más vistas</button>
        <button class="sort-btn" id="sort-intense" onclick="setSort('intense')">Más intensos</button>
      </div>
      <div class="results-count" id="results-count"></div>
    </div>

    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <!-- ── EPISODE DETAIL VIEW ── -->
  <div class="view" id="view-episode">
    <div class="episode-hero">
      <button class="ep-back" onclick="navigate('feed')">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Volver a episodios
      </button>
      <div id="episode-detail-content"></div>
    </div>
  </div>

  <!-- ── STATS VIEW ── -->
  <div class="view" id="view-stats">
    <div class="stats-container">
      <div class="stats-header">
        <div class="stats-title">El <em>Mapa</em> de las Anécdotas</div>
        <div class="feed-sub">Patrones en el corpus completo</div>
      </div>
      <div id="stats-content"></div>
    </div>
  </div>

  <!-- ── SEARCH VIEW ── -->
  <div class="view" id="view-search">
    <div class="search-container">
      <div class="search-header">
        <div class="search-title">Buscar <em>historias</em></div>
        <div class="search-sub">Buscá por tema, personaje, emoción o lo que se te ocurra</div>
      </div>
      <div class="search-box-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="ej: casamiento, pelea, laburo, accidente..." oninput="doSearch(this.value)">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="search-filters" id="search-tag-filters"></div>
      <div class="search-results" id="search-results">
        <div class="empty-state">
          <div class="empty-icon">&ldquo;</div>
          <div>Escribí algo para buscar entre las anécdotas</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════
// DATA — feed liviano desde data/index.json
//        transcript completo desde data/episodes/{id}.json (lazy)
// ═══════════════════════════════════════════════════
let EPISODES = [];
const _epCache = {};  // cache de episodios completos ya cargados

async function loadEpisodes() {
  try {
    const res = await fetch('data/index.json');
    if (res.ok) {
      EPISODES = await res.json();
      init();
      return;
    }
  } catch(e) {}
  console.error('No se pudo cargar data/index.json');
}

// Devuelve el episodio completo (con transcript). Lo cachea después del primer fetch.
async function loadFullEpisode(id) {
  if (_epCache[id]) return _epCache[id];
  const base = EPISODES.find(e => e.id === id);
  try {
    const res = await fetch(`data/episodes/${id}.json`);
    if (res.ok) {
      const full = await res.json();
      _epCache[id] = full;
      return full;
    }
  } catch(e) {}
  return base;  // fallback: datos del índice (sin transcript)
}

function init() {
  filteredEps = [...EPISODES];
  buildFilters();
  sortAndRender();
  initSearch();
}

loadEpisodes();


// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
const ARC_COLORS = {
  "dramático": "#c0392b",
  "cómico": "#d4a017",
  "emotivo": "#5b8def",
  "absurdo": "#9b59b6"
};

const CAT_COLORS = {
  "infidelidad": "#c0392b", "familia": "#8B6914", "judicial": "#5b8def",
  "laboral": "#2ecc71", "cómico": "#d4a017", "salud": "#e74c3c",
  "burocracia": "#7f8c8d", "vecinos": "#9b59b6", "viaje": "#27ae60",
  "solidaridad": "#16a085", "romance": "#e91e8c", "delito": "#c0392b",
  "urbano": "#607d8b", "generacional": "#ff9800", "tecnología": "#00bcd4",
  "histórico": "#795548", "migración": "#4caf50", "barrio": "#8bc34a",
  "deuda": "#f44336", "amistad": "#3f51b5", "policial": "#455a64",
  "animales": "#8d6e63", "muerte": "#546e7a"
};

function arcColor(arc) { return ARC_COLORS[arc] || "#888"; }
function catColor(cat) { return CAT_COLORS[cat] || "#666"; }
function fmt(n) { return n >= 1000000 ? (n/1000000).toFixed(1)+"M" : n >= 1000 ? Math.round(n/1000)+"K" : n; }
function fmtDur(s) { const m=Math.floor(s/60),se=s%60; return `${m}:${se.toString().padStart(2,'0')}`; }
function fmtDate(d) { const [y,m,day]=d.split('-'); const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`; }

function thumbGradient(ep) {
  const arcs = ep.analysis.emotional_arc;
  const c1 = arcColor(arcs);
  const c2 = "#161511";
  const hue = (ep.episode_number * 37) % 360;
  return `linear-gradient(135deg, ${c2} 0%, oklch(20% 0.05 ${hue}) 100%)`;
}

function tagEl(text, colored=true) {
  const c = colored ? catColor(text) : "#666";
  return `<span class="tag" style="color:${c};border-color:${c}22;background:${c}18">${text}</span>`;
}

// ═══════════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════════
let currentView = 'feed';
let currentEpisodeId = null;

async function navigate(view, id=null) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  const navEl = document.getElementById(`nav-${view}`);
  if(navEl) navEl.classList.add('active');
  currentView = view;
  if(view==='episode' && id) {
    currentEpisodeId = id;
    renderEpisode(id);
    const ep = filteredEps.find(e => e.id === id) || allEps.find(e => e.id === id);
    trackEvent(id, ep?.episode_number ?? null, 'open');
  }
  if(view==='stats') renderStats();
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════════════
// FEED
// ═══════════════════════════════════════════════════
let currentSort = 'recent';
let filteredEps = [...EPISODES];

function buildFilters() {
  const cats = [...new Set(EPISODES.flatMap(e=>e.analysis.categories))].sort();
  const arcs = [...new Set(EPISODES.map(e=>e.analysis.emotional_arc))].sort();
  const geos = [...new Set(EPISODES.flatMap(e=>e.analysis.geography))].sort();
  const catSel = document.getElementById('filter-cat');
  const arcSel = document.getElementById('filter-arc');
  const geoSel = document.getElementById('filter-geo');
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
  arcs.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;arcSel.appendChild(o);});
  geos.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;geoSel.appendChild(o);});
}

function applyFilters() {
  const cat = document.getElementById('filter-cat').value;
  const arc = document.getElementById('filter-arc').value;
  const geo = document.getElementById('filter-geo').value;
  filteredEps = EPISODES.filter(e=>{
    if(cat && !e.analysis.categories.includes(cat)) return false;
    if(arc && e.analysis.emotional_arc!==arc) return false;
    if(geo && !e.analysis.geography.includes(geo)) return false;
    return true;
  });
  const active = Object.fromEntries(Object.entries({cat,arc,geo}).filter(([,v])=>v));
  if(Object.keys(active).length) trackEvent(null, null, 'filter', active);
  sortAndRender();
}

function setSort(s) {
  currentSort = s;
  ['recent','views','intense'].forEach(x=>{
    document.getElementById(`sort-${x}`).classList.toggle('active', x===s);
  });
  sortAndRender();
}

function sortAndRender() {
  const sorted = [...filteredEps].sort((a,b)=>{
    if(currentSort==='recent') return new Date(b.published_date)-new Date(a.published_date);
    if(currentSort==='views') return b.views-a.views;
    if(currentSort==='intense') return b.analysis.intensity-a.analysis.intensity;
    return 0;
  });
  document.getElementById('results-count').textContent = `${sorted.length} episodios`;
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = sorted.map(ep=>cardHTML(ep)).join('');
}

function cardHTML(ep) {
  const a = ep.analysis;
  return `
  <div class="episode-card" onclick="navigate('episode','${ep.id}')">
    <div class="card-thumb">
      <div class="thumb-bg" style="background:${thumbGradient(ep)}">
        #${ep.episode_number}
      </div>
      <div class="ep-badge">#${ep.episode_number}</div>
      <div class="duration-badge">${fmtDur(ep.duration_seconds)}</div>
      ${a.has_twist?'<div class="twist-badge">Giro</div>':''}
      ${a.bonus_track?'<div class="bonus-badge">Bonus</div>':''}
      <div class="card-thumb-overlay">
        <div class="play-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 3L13 8L5 13V3Z" fill="#0e0d0b"/></svg>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-cats">${a.categories.slice(0,3).map(c=>tagEl(c)).join('')}</div>
      <div class="card-title">${ep.title}</div>
      <div class="card-summary">${a.summary}</div>
      <div class="card-meta">
        <div class="arc-dot" style="background:${arcColor(a.emotional_arc)}"></div>
        <span style="font-size:12px;color:var(--text-dim)">${a.emotional_arc}</span>
        <span style="margin-left:4px">${fmt(ep.views)} vistas</span>
        <div class="intensity-bar" title="Intensidad ${a.intensity}/10">
          <div class="intensity-fill" style="width:${a.intensity*10}%"></div>
        </div>
        <span style="font-size:11px;color:var(--text-muted)">${a.intensity}/10</span>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════
// EPISODE DETAIL
// ═══════════════════════════════════════════════════
async function renderEpisode(id) {
  const container = document.getElementById('episode-detail-content');
  container.innerHTML = '<div style="padding:40px;color:var(--text-muted);text-align:center">Cargando...</div>';
  const ep = await loadFullEpisode(id);
  if(!ep) {
    container.innerHTML = '<div style="padding:40px;color:var(--crimson);text-align:center">No se pudo cargar el episodio.</div>';
    return;
  }
  const a = ep.analysis;
  container.innerHTML = `
    <div class="ep-player">
      <iframe src="https://www.youtube.com/embed/${ep.id}?autoplay=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="ep-meta-row">
      <span class="ep-num">Episodio #${ep.episode_number}</span>
      <span class="ep-date">${fmtDate(ep.published_date)}</span>
      <span style="color:var(--text-muted);font-size:13px">· ${fmtDur(ep.duration_seconds)}</span>
    </div>
    <div class="ep-title-large">${ep.title}</div>
    <div class="ep-stats-row">
      <div class="ep-stat">
        <div class="ep-stat-value">${fmt(ep.views)}</div>
        <div class="ep-stat-label">Reproducciones</div>
      </div>
      <div class="ep-stat">
        <div class="ep-stat-value">${fmt(ep.likes)}</div>
        <div class="ep-stat-label">Me gusta</div>
      </div>
      <div class="ep-stat">
        <div class="ep-stat-value" style="color:${arcColor(a.emotional_arc)}">${a.emotional_arc}</div>
        <div class="ep-stat-label">Arco emocional</div>
      </div>
      <div class="ep-stat">
        <div class="ep-stat-value" style="color:${a.intensity>=7?'var(--crimson)':'var(--gold)'}">${a.intensity}<span style="font-size:18px;color:var(--text-muted)">/10</span></div>
        <div class="ep-stat-label">Intensidad</div>
      </div>
    </div>
    <div class="ep-two-col">
      <div>
        <div class="ep-section-title">Resumen</div>
        <div class="ep-summary-text">${a.summary}</div>
        ${a.bonus_track ? `
        <div class="ep-section-title" style="margin-top:24px">Bonus track</div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:24px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <div class="arc-dot" style="background:${arcColor(a.bonus_track.emotional_arc)}"></div>
            <span style="font-size:12px;color:var(--text-dim)">${a.bonus_track.emotional_arc} · intensidad ${a.bonus_track.intensity}/10</span>
            <div class="intensity-bar" style="max-width:40px" title="Intensidad ${a.bonus_track.intensity}/10">
              <div class="intensity-fill" style="width:${a.bonus_track.intensity*10}%"></div>
            </div>
          </div>
          <div style="font-size:14px;line-height:1.6;color:var(--text)">${a.bonus_track.summary}</div>
          <div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap">${a.bonus_track.archetypes.map(t=>`<span class="tag" style="color:var(--text-dim);border-color:var(--border);background:var(--bg3)">${t}</span>`).join('')}</div>
        </div>` : ''}

      </div>
      <div class="ep-sidebar">
        <div class="analysis-card">
          <div class="ep-section-title" style="margin-bottom:12px">Análisis</div>
          <div class="analysis-row">
            <span class="analysis-row-key">Intensidad</span>
            <div class="intensity-large" style="width:180px">
              <div class="intensity-track">
                <div class="intensity-thumb" style="width:${a.intensity*10}%"></div>
              </div>
              <span style="font-size:13px;font-weight:700;color:var(--text)">${a.intensity}/10</span>
            </div>
          </div>
          <div class="analysis-row">
            <span class="analysis-row-key">Época</span>
            <span class="analysis-row-val">${a.era}</span>
          </div>
          <div class="analysis-row">
            <span class="analysis-row-key">Protagonista</span>
            <span class="analysis-row-val">${a.protagonist_role}</span>
          </div>
          <div class="analysis-row">
            <span class="analysis-row-key">Credibilidad</span>
            <span class="analysis-row-val">${a.credibility}</span>
          </div>
          <div class="analysis-row">
            <span class="analysis-row-key">Giro inesperado</span>
            <span class="analysis-row-val" style="color:${a.has_twist?'var(--gold)':'var(--text-dim)'}">${a.has_twist?'Sí':'No'}</span>
          </div>
          ${a.institutions_involved.length ? `<div class="analysis-row">
            <span class="analysis-row-key">Instituciones</span>
            <span class="analysis-row-val">${a.institutions_involved.join(', ')}</span>
          </div>` : ''}
          ${a.historical_events && a.historical_events.length ? `<div class="analysis-row">
            <span class="analysis-row-key">Evento histórico</span>
            <span class="analysis-row-val">${a.historical_events.join(', ')}</span>
          </div>` : ''}
        </div>
        <div class="analysis-card">
          <div class="ep-section-title" style="margin-bottom:12px">Categorías</div>
          <div class="tags-cloud">${a.categories.map(c=>tagEl(c)).join('')}</div>
        </div>
        <div class="analysis-card">
          <div class="ep-section-title" style="margin-bottom:12px">Geografía</div>
          <div class="tags-cloud">${a.geography.map(g=>`<span class="tag" style="color:var(--text-dim);border-color:var(--border);background:var(--bg3)">📍 ${g}</span>`).join('')}</div>
        </div>
        <div class="analysis-card">
          <div class="ep-section-title" style="margin-bottom:12px">Arquetipos</div>
          <div class="tags-cloud">${a.archetypes.map(t=>`<span class="tag" style="color:var(--text-dim);border-color:var(--border);background:var(--bg3)">${t}</span>`).join('')}</div>
        </div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════
function renderStats() {
  const container = document.getElementById('stats-content');
  const totalViews = EPISODES.reduce((s,e)=>s+e.views,0);
  const totalLikes = EPISODES.reduce((s,e)=>s+e.likes,0);
  const twistCount = EPISODES.filter(e=>e.analysis.has_twist).length;
  const avgIntensity = (EPISODES.reduce((s,e)=>s+e.analysis.intensity,0)/EPISODES.length).toFixed(1);

  // Arc distribution
  const arcCounts = {};
  EPISODES.forEach(e=>{ arcCounts[e.analysis.emotional_arc]=(arcCounts[e.analysis.emotional_arc]||0)+1; });

  // Category distribution
  const catCounts = {};
  EPISODES.forEach(e=>e.analysis.categories.forEach(c=>{ catCounts[c]=(catCounts[c]||0)+1; }));
  const topCats = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat = topCats[0]?.[1]||1;

  // Geography
  const geoCounts = {};
  EPISODES.forEach(e=>e.analysis.geography.forEach(g=>{ geoCounts[g]=(geoCounts[g]||0)+1; }));
  const topGeo = Object.entries(geoCounts).sort((a,b)=>b[1]-a[1]);
  const maxGeo = topGeo[0]?.[1]||1;

  // Top 10 views
  const top10views = [...EPISODES].sort((a,b)=>b.views-a.views).slice(0,5);
  const top10intense = [...EPISODES].sort((a,b)=>b.analysis.intensity-a.analysis.intensity).slice(0,5);

  container.innerHTML = `
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-value">${fmt(totalViews)}</div>
      <div class="kpi-label">Reproducciones totales</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value">${fmt(totalLikes)}</div>
      <div class="kpi-label">Me gusta totales</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value">${twistCount}</div>
      <div class="kpi-label">Episodios con giro</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value">${avgIntensity}</div>
      <div class="kpi-label">Intensidad promedio</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-panel">
      <div class="stat-panel-title">Categorías más frecuentes</div>
      ${topCats.map(([cat,count])=>`
        <div class="bar-row">
          <div class="bar-label">${cat}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(count/maxCat)*100}%;background:${catColor(cat)}"></div></div>
          <div class="bar-value">${count} ep.</div>
        </div>`).join('')}
    </div>
    <div class="stat-panel">
      <div class="stat-panel-title">Arcos emocionales</div>
      <div class="arc-legend" style="margin-bottom:20px">
        ${Object.entries(arcCounts).map(([arc,count])=>`
          <div class="arc-item">
            <div class="arc-swatch" style="background:${arcColor(arc)}"></div>
            <span>${arc} <span style="color:var(--text-muted)">(${count})</span></span>
          </div>`).join('')}
      </div>
      ${Object.entries(arcCounts).sort((a,b)=>b[1]-a[1]).map(([arc,count])=>`
        <div class="bar-row">
          <div class="bar-label">${arc}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(count/EPISODES.length)*100}%;background:${arcColor(arc)}"></div></div>
          <div class="bar-value">${count} ep.</div>
        </div>`).join('')}
    </div>
    <div class="stat-panel">
      <div class="stat-panel-title">Top 5 · Más vistas</div>
      <div class="top10-list">
        ${top10views.map((ep,i)=>`
          <div class="top10-item" onclick="navigate('episode','${ep.id}')">
            <div class="top10-rank">${i+1}</div>
            <div class="top10-info">
              <div class="top10-ep-title">${ep.title}</div>
              <div class="top10-ep-meta">#${ep.episode_number} · ${fmtDate(ep.published_date)}</div>
            </div>
            <div class="top10-value">${fmt(ep.views)}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="stat-panel">
      <div class="stat-panel-title">Top 5 · Más intensos</div>
      <div class="top10-list">
        ${top10intense.map((ep,i)=>`
          <div class="top10-item" onclick="navigate('episode','${ep.id}')">
            <div class="top10-rank">${i+1}</div>
            <div class="top10-info">
              <div class="top10-ep-title">${ep.title}</div>
              <div class="top10-ep-meta">#${ep.episode_number} · ${ep.analysis.emotional_arc}</div>
            </div>
            <div class="top10-value" style="color:var(--crimson)">${ep.analysis.intensity}/10</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="stat-panel stats-grid-wide">
      <div class="stat-panel-title">Geografía</div>
      <div class="geo-grid">
        ${topGeo.map(([geo,count])=>`
          <div class="geo-item">
            <div class="geo-name">${geo}</div>
            <div class="geo-count">${count} episodio${count>1?'s':''}</div>
            <div class="geo-bar"><div class="geo-bar-fill" style="width:${(count/maxGeo)*100}%"></div></div>
          </div>`).join('')}
      </div>
    </div>
  </div>
  `;
}

// ═══════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════
let fuse;
let searchTagFilter = null;

function initSearch() {
  fuse = new Fuse(EPISODES, {
    keys: [
      { name:'title', weight:2 },
      { name:'analysis.summary', weight:2 },
      { name:'analysis.categories', weight:1.5 },
      { name:'analysis.archetypes', weight:1 },

    ],
    threshold: 0.35,
    includeMatches: true,
    minMatchCharLength: 2
  });

  // Build tag filter cloud
  const cats = [...new Set(EPISODES.flatMap(e=>e.analysis.categories))].sort();
  const container = document.getElementById('search-tag-filters');
  container.innerHTML = cats.map(c=>`
    <span class="tag" style="cursor:pointer;color:${catColor(c)};border-color:${catColor(c)}33;background:${catColor(c)}15;font-size:11px;padding:4px 10px"
      onclick="toggleTagFilter('${c}',this)">${c}</span>`).join('');
}

function toggleTagFilter(cat, el) {
  if(searchTagFilter===cat) {
    searchTagFilter=null;
    el.style.boxShadow='';
    el.style.borderColor=`${catColor(cat)}33`;
  } else {
    searchTagFilter=cat;
    document.querySelectorAll('#search-tag-filters .tag').forEach(t=>{
      t.style.boxShadow=''; t.style.borderColor=`${catColor(t.textContent)}33`;
    });
    el.style.boxShadow=`0 0 0 2px ${catColor(cat)}`;
    el.style.borderColor=catColor(cat);
  }
  doSearch(document.getElementById('search-input').value);
}

let _searchTimer;
function doSearch(query) {
  clearTimeout(_searchTimer);
  if(query && query.length > 2) {
    _searchTimer = setTimeout(() => trackEvent(null, null, 'search', { query }), 1000);
  }
  const container = document.getElementById('search-results');
  let results;

  if(!query && !searchTagFilter) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">&ldquo;</div><div>Escribí algo para buscar entre las anécdotas</div></div>`;
    return;
  }

  if(query) {
    let fuseRes = fuse.search(query);
    if(searchTagFilter) fuseRes = fuseRes.filter(r=>r.item.analysis.categories.includes(searchTagFilter));
    results = fuseRes.map(r=>({ep:r.item, score:r.score}));
  } else {
    results = EPISODES.filter(e=>e.analysis.categories.includes(searchTagFilter)).map(e=>({ep:e,score:0}));
  }

  if(!results.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">?</div><div>No encontramos nada con eso. Probá con otras palabras.</div></div>`;
    return;
  }

  container.innerHTML = results.map(({ep})=>`
    <div class="search-result" onclick="navigate('episode','${ep.id}')">
      <div class="search-thumb" style="background:${thumbGradient(ep)}">#${ep.episode_number}</div>
      <div class="search-result-body">
        <div class="search-result-ep">Episodio #${ep.episode_number} · ${ep.analysis.emotional_arc}</div>
        <div class="search-result-title">${ep.title}</div>
        <div class="search-result-summary">${ep.analysis.summary}</div>
        <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">${ep.analysis.categories.slice(0,4).map(c=>tagEl(c)).join('')}</div>
      </div>
    </div>`).join('');
}

trackEvent(null, null, 'session_start');
</script>
